<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">充值凭证示例</title>
  <desc id="description">华北恒信通讯有限公司银行转账充值回单</desc>
  <rect width="960" height="720" fill="#f0f2f5"/>
  <rect x="58" y="48" width="844" height="624" rx="18" fill="#ffffff" stroke="#e5e6eb" stroke-width="3"/>
  <rect x="58" y="48" width="844" height="108" rx="18" fill="#6e20af"/>
  <rect x="58" y="132" width="844" height="24" fill="#6e20af"/>
  <text x="96" y="116" fill="#ffffff" font-family="PingFang SC, sans-serif" font-size="36" font-weight="700">银行转账充值回单</text>
  <text x="96" y="206" fill="#999999" font-family="PingFang SC, sans-serif" font-size="22">交易流水</text>
  <text x="330" y="206" fill="#262626" font-family="Arial, sans-serif" font-size="24">CZ2026000001</text>
  <line x1="96" y1="232" x2="864" y2="232" stroke="#eeeeee" stroke-width="2"/>
  <text x="96" y="286" fill="#999999" font-family="PingFang SC, sans-serif" font-size="22">付款单位</text>
  <text x="330" y="286" fill="#262626" font-family="PingFang SC, sans-serif" font-size="24">华北恒信通讯有限公司</text>
  <line x1="96" y1="312" x2="864" y2="312" stroke="#eeeeee" stroke-width="2"/>
  <text x="96" y="366" fill="#999999" font-family="PingFang SC, sans-serif" font-size="22">收款账户</text>
  <text x="330" y="366" fill="#262626" font-family="PingFang SC, sans-serif" font-size="24">平台资金账户-001</text>
  <line x1="96" y1="392" x2="864" y2="392" stroke="#eeeeee" stroke-width="2"/>
  <text x="96" y="446" fill="#999999" font-family="PingFang SC, sans-serif" font-size="22">充值金额</text>
  <text x="330" y="446" fill="#6e20af" font-family="Arial, sans-serif" font-size="38" font-weight="700">CNY 85,000.00</text>
  <line x1="96" y1="478" x2="864" y2="478" stroke="#eeeeee" stroke-width="2"/>
  <text x="96" y="532" fill="#999999" font-family="PingFang SC, sans-serif" font-size="22">交易时间</text>
  <text x="330" y="532" fill="#262626" font-family="Arial, sans-serif" font-size="24">2026-07-17 09:30</text>
  <rect x="682" y="548" width="152" height="72" rx="36" fill="#faf7fc" stroke="#6e20af" stroke-width="3"/>
  <text x="714" y="594" fill="#6e20af" font-family="PingFang SC, sans-serif" font-size="24" font-weight="700">交易成功</text>
</svg>
